name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every push to main publishes a throwaway version under the `next` tag, so a fix can be
  # installed before it is released. Versions look like 0.0.0-next-1a2b3c4d-20261117, which
  # sorts below any real release, so `npm install @descope/poppy-agent` never picks one up.
  #
  # This job fails until the package exists on npm: trusted publishing can configure a
  # publisher only for a package that is already there, so the first publish has to be done
  # by hand. Once it has been, this and the release job both work with no token anywhere.
  publish-next:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Name this build after the commit and the day
        run: echo "NEW_VERSION=0.0.0-next-$(echo ${{ github.sha }} | cut -c1-8)-$(date +'%Y%m%d')" >> "$GITHUB_ENV"
      - run: npm version "${NEW_VERSION}" --no-git-tag-version
      # --ignore-scripts, then build explicitly: a dependency's install script would otherwise
      # run in a job that holds a publishing identity.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: npm publish --access=public --tag next --provenance

  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PEM }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # npm CLI, not pnpm: trusted publishing needs npm >= 11.5.1, which the Node above ships.
      # --provenance records a signed attestation of which workflow and commit built this
      # tarball, which is most of the point of publishing from CI rather than a laptop.
      - run: npm publish --access=public --provenance
